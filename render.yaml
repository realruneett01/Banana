services:
  - type: web
    name: banana2
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health-check
    envVars:
      - key: NODE_ENV
        value: production
      - key: KICAD_CLI_PATH
        value: /usr/bin/kicad-cli
      - key: FREEROUTING_JAR
        value: /opt/freerouting/freerouting.jar
      - key: OAUTH_STATE_DB
        value: /app/temp_storage/oauth-states.db
      - key: NGSPICE_PATH
        value: /usr/bin/ngspice
      - key: KICAD_SYMBOL_DIR
        value: /usr/share/kicad/symbols
      - key: KICAD_FOOTPRINT_DIR
        value: /usr/share/kicad/footprints
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
