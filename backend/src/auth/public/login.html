<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Banana</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<main class="card" aria-labelledby="title">
  <div class="brand"><span class="logo" aria-hidden="true">🍌</span>
    <div><h1 id="title">Banana 2.0</h1><p>Visual Hardware Diff Studio</p></div>
  </div>
  <form id="form" novalidate>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <div class="pw">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" id="toggle" class="ghost" aria-label="Show password">Show</button>
    </div>
    <p id="error" role="alert" class="error" hidden></p>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <p id="setup" class="note" hidden>No accounts exist yet. On the server, run <code>npm run user -- add &lt;name&gt; --admin</code>, then reload this page.</p>
  <p class="note">Access is limited to licensed users. Sessions end when you sign out or after the configured time.</p>
</main>
<script src="login.js"></script>
</body>
</html>
