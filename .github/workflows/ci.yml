name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers ARM64; windows-latest covers Windows; macos-latest is Apple silicon.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install KiCad (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
      - name: Install KiCad (Windows)
        if: runner.os == 'Windows'
        run: choco install kicad --no-progress -y
      - name: Install KiCad (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask kicad
      - run: npm ci
      - run: npm run build
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Failures from the test run (the full log is too long to read)
        if: failure()
        shell: bash
        run: grep -n -E -B1 -A18 '^[[:space:]]*not ok ' test.log | head -600 || true
      - name: Preflight + ground-truth self-test
        run: node scripts/preflight.mjs --no-write
      - name: Portable bundle builds and has no native add-ons
        run: node scripts/make-portable.mjs "${{ runner.temp }}/banana-portable"
      - name: Portable bundle passes its own preflight
        run: node scripts/preflight.mjs --no-write
        working-directory: ${{ runner.temp }}/banana-portable

  kicad-versions:
    name: KiCad ${{ matrix.kicad }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.kicad == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        # Banana supports KiCad 7 and newer; every release runs the full suite against the real kicad-cli.
        kicad: ["7.0", "8.0", "9.0", "10.0", "nightly"]
    container:
      image: kicad/kicad:${{ matrix.kicad }}
      options: --user root
    env:
      KICAD_CLI_PATH: /usr/bin/kicad-cli
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Tooling (git, Node.js 22, ngspice, python)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl git ca-certificates python3 ngspice gnupg
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          kicad-cli --version
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Capabilities detected for this KiCad
        run: node -e "import('./backend/src/config.js').then(async c=>{const k=await import('./backend/src/kicad-compat.js');console.log(k.describeCapabilities(k.getCapabilities({cliPath:c.config.kicadCliPath,version:c.config.kicadVersion})))})"
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Failures from the test run (the full log is too long to read)
        if: failure()
        run: grep -n -E -B1 -A18 '^[[:space:]]*not ok ' test.log | head -600 || true
      - name: What this KiCad does with a small board
        if: failure()
        run: node scripts/ci-diagnose.mjs || true
      - name: Preflight self-test
        run: node scripts/preflight.mjs --no-write

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t banana:ci .
      - name: Container preflight (includes self-test with the image's KiCad)
        run: docker run --rm banana:ci node scripts/preflight.mjs --no-write
      - name: Container serves the API
        run: |
          docker run -d --name banana -p 5000:5000 banana:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5000/api/health-check && exit 0; sleep 2; done
          docker logs banana; exit 1

  systemd-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: systemd-analyze verify deploy/banana.service
